<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executive Dashboard</title>

  <link rel="stylesheet" href="css/style.css">

 <link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>
</head>

<body>

<div class="container">

  <!-- Sidebar -->
  <aside class="sidebar">

    <h2>TaskFlow</h2>

    <nav>

      <a href="index.html" class="menu-link active">
        Dashboard
      </a>

      <a href="tasks.html" class="menu-link">
        Tasks
      </a>

      <a href="projects.html" class="menu-link">
        Projects
      </a>

      <a href="reports.html" class="menu-link">
        Reports
      </a>

    </nav>

  </aside>

  <!-- Main -->
  <main class="main-content">

    <header class="topbar">

      <div>
        <h1>Executive Dashboard</h1>
        <p>Manage tasks efficiently</p>
      </div>

      <div class="notification">
        <i class="fa-solid fa-bell"></i>
        <span id="notificationCount">0</span>
      </div>

    </header>

    <!-- KPI -->
    <section class="kpi-grid">

      <div class="card">
        <h3>Total Tasks</h3>
        <h2 id="totalTasks">0</h2>
      </div>

      <div class="card">
        <h3>Completed</h3>
        <h2 id="completedTasks">0</h2>
      </div>

      <div class="card">
        <h3>Pending</h3>
        <h2 id="pendingTasks">0</h2>
      </div>

      <div class="card">
        <h3>Projects Completed</h3>
        <h2 id="projectCompleted">0</h2>
      </div>

    </section>

  </main>

</div>

<script src="js/app.js"></script>

</body>
</html>
