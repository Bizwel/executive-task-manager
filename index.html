<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Executive Task Manager</title>
  <link rel="stylesheet" href="style.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
</head>
<body>

<div class="container">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>TaskFlow</h2>

  <nav>

  <button class="menu-btn active" onclick="showSection('todo')">
    To Do
  </button>

  <button class="menu-btn" onclick="showSection('tasks')">
    Tasks
  </button>

  <button class="menu-btn" onclick="showSection('projects')">
    Projects
  </button>

  <button class="menu-btn" onclick="showSection('reports')">
    Reports
  </button>

</nav>
  </aside>

  <!-- Main -->
  <main class="main-content">

    <!-- Header -->
    <header class="topbar">
      <div>
        <h1>Executive Dashboard</h1>
        <p>Manage tasks efficiently</p>
      </div>

      <div class="top-actions">
        <div class="notification">
          <i class="fa-solid fa-bell"></i>
          <span id="notificationCount">0</span>
        </div>
      </div>
    </header>

    <!-- KPI -->
    <section class="kpi-grid">

      <div class="card">
        <h3>Total Tasks</h3>
        <h2 id="totalTasks">0</h2>
      </div>

      <div class="card">
        <h3>Completed</h3>
</html>
